name: 功能建议
description: 描述具体场景与希望改善的体验
title: "[建议] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与问题
      description: 目前哪一步不方便？请给出具体例子和使用平台。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的操作与结果
      description: 说明操作后应看到什么，以及现在如何处理。
    validations:
      required: true
